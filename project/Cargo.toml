[package]
name = "project"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
scraper = "0.22"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
winit = "0.30"
softbuffer = "0.4"

[dependencies.uuid]
version = "1.26.1"
# Lets you generate random UUIDs
features = [
    "v4",
]
